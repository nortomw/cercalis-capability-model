<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Cadena Rule-Evidence-Finding-Recommendation-Implementation</title>
<desc>Rule, Evidence y Finding forman la fase de Diagnosis. Recommendation e Implementation forman la fase de Action.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 Z" fill="#3d3d3a"/>
</marker>
</defs>

<!-- Diagnosis container -->
<rect x="170" y="40" width="340" height="260" rx="14" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 5"/>

<!-- Action container -->
<rect x="170" y="320" width="340" height="180" rx="14" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 5"/>

<!-- Rule -->
<rect x="220" y="60" width="240" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="340" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#04342C">Rule</text>
<line x1="340" y1="110" x2="340" y2="136" stroke="#3d3d3a" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Evidence -->
<rect x="220" y="140" width="240" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="340" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#04342C">Evidence</text>
<line x1="340" y1="190" x2="340" y2="216" stroke="#3d3d3a" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Finding -->
<rect x="220" y="220" width="240" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="340" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#04342C">Finding</text>

<text x="340" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#5F5E5A" letter-spacing="1">DIAGNOSIS</text>

<line x1="340" y1="270" x2="340" y2="336" stroke="#3d3d3a" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Recommendation -->
<rect x="220" y="340" width="240" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="340" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#4A1B0C">Recommendation</text>
<line x1="340" y1="390" x2="340" y2="416" stroke="#3d3d3a" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Implementation -->
<rect x="220" y="420" width="240" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="340" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#4A1B0C">Implementation</text>

<text x="340" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#5F5E5A" letter-spacing="1">ACTION</text>

</svg>
